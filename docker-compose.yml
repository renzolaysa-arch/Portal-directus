services:
  directus:
    # Etiqueta y digest (del indice multiarquitectura) fijos; al subir de version se cambian
    # ambos. Digest nuevo: docker buildx imagetools inspect directus/directus:<version>
    image: directus/directus:11.14.0@sha256:048e061ca3cbe0bca47daa2c493b31b7f4195913a14bdf221308dc1345656225
    container_name: portal-directus
    ports:
      # Solo en localhost: se llega por el proxy /directus del servidor web. En Linux,
      # Docker abre los puertos publicados saltandose el cortafuegos.
      - "127.0.0.1:8055:8055"
    env_file:
      - directus.env
    volumes:
      - ./uploads:/directus/uploads
    restart: unless-stopped
